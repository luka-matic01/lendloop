services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - path: .env.local
        required: false
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-lendloop_dev_encryption_key_change_me}
      # Allow n8n Code / Expression nodes to read strictly scoped environment variables
      # so secrets are never stored in exported workflow JSON files.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET:-dev_hmac_secret_replace_in_env_local}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-https://replace-me.convex.site}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/workflows:ro

volumes:
  n8n_data:
